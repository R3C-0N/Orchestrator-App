[package]
name = "orchestrator"
version = "0.1.0"
description = "Interface de bureau pour Claude Code"
edition = "2021"
rust-version = "1.94"
default-run = "orchestrator"

[lib]
name = "orchestrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "orchestrator"
path = "src/main.rs"

# Mode sans interface : lance claude.exe, envoie un message, imprime les CoreEvent.
[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# Journal (plan 1.9) : %LOCALAPPDATA%\orchestrator\logs, rotation quotidienne.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
